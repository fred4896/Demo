<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEMO</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
      background: #0e1726;
      color: #e8eef7
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border: 0;
      border-radius: 12px;
      margin: 8px 0;
      color: #fff
    }

    .a {
      background: #0d6efd
    }

    .b {
      background: #6c757d
    }

    #st {
      color: #f5b942;
      font-size: 13px;
      min-height: 18px;
      text-align: center;
      margin-top: 12px
    }

    p {
      color: #9fb0c7;
      font-size: 13px
    }
  </style>
</head>

<body>
  <p>按钮 A：navigator.share，带图片文件（真实分享）</p>
  <button class="a" id="btnA">A · navigator.share 带图片</button>

  <p>按钮 B：intent:// 直接指向 TNG eWallet，extras 带 QR 图片 URL</p>
  <button class="b" id="btnB">B · intent:// SEND → TNG</button>

  <div id="st"></div>

  <script>
    const st = document.getElementById('st');

    // qr.png 的公网地址 —— 给按钮 B 的 intent extras 使用
    const RAW_QR_URL = 'https://fred4896.github.io/Demo/qr.png';
    const TARGET_PACKAGE = 'my.com.tngdigital.ewallet';

    document.getElementById('btnA').onclick = async () => {
      try {
        const blob = await (await fetch('qr.png')).blob();
        const file = new File([blob], 'qr.png', { type: blob.type || 'image/png' });
        if (!navigator.canShare || !navigator.canShare({ files: [file] })) {
          st.textContent = '此浏览器不支持文件分享';
          return;
        }
        await navigator.share({ files: [file], title: 'QR' });
        st.textContent = 'A 完成（图片已附带，接收方拿到真实文件）';
      } catch (e) {
        st.textContent = 'A: ' + (e.name === 'AbortError' ? '用户取消' : e.message);
      }
    };

    document.getElementById('btnB').onclick = () => {
      st.textContent = "正在调起 Touch 'n Go eWallet...";

      // 对链接进行 URL 编码，防止参数中的特殊字符导致 Intent 解析失败
      const ENCODED_URL = encodeURIComponent(RAW_QR_URL);

      // 构建 Android Intent URI：指定包名以绕过选择弹窗
      const intentUrl = `intent://#Intent;` +
        `action=android.intent.action.SEND;` +
        `type=image/png;` +
        `S.android.intent.extra.STREAM=${ENCODED_URL};` +
        `S.android.intent.extra.TEXT=${ENCODED_URL};` +
        `package=${TARGET_PACKAGE};` +
        `end`;

      // 重定向触发 Intent 启动 App
      window.location.href = intentUrl;
    };
  </script>
</body>

</html>
