<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEMO</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 20px;
      background: #0e1726;
      color: #e8eef7;
      min-height: 100vh;
    }

    .card {
      background: #182234;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    h3 {
      margin: 0 0 8px;
    }

    p {
      color: #9fb0c7;
      font-size: 14px;
      margin: 4px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 17px;
      border: 0;
      border-radius: 12px;
      background: #0d6efd;
      color: #fff;
      margin-top: 8px;
      cursor: pointer;
    }

    button:active {
      opacity: .8;
    }

    img {
      width: 200px;
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      display: block;
      margin: 12px auto;
    }

    #status {
      color: #f5b942;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h3>QR Demo</h3>
    <p>点击按钮将直接直达</p>
  </div>
  <div class="card">
    <img id="qrImage"
      src="https://public-api.qr-code-generator.com/v1/create/extended?image_format=PNG&image_width=300&qr_code_text=00020201021126580014A000000615000101065641600226125707800032079RHBQR2381645204597153034585802MY5918NORSAZILAH+MAKE+UP6002MY61051320062300309ROA3112090713norsazilah1238264EF624610E711386912E962B864942124E3DB42E423F9F29557473E4F279E3AF06304AFA0&foreground_color=%23000000&background_color=%23FFFFFF&frame_name=no-frame"
      alt="QR">
    <button id="btn">Open</button>
    <div id="status">准备就绪</div>
  </div>

  <script>
    const st = document.getElementById('status');

    // 图片 URL 地址
    const CONTENT_URI = "content://media/external/images/media/1000000078";
    const ENCODED_URI = encodeURIComponent(CONTENT_URI);
    const TARGET_PACKAGE = 'my.com.tngdigital.ewallet';


    document.getElementById('btn').onclick = () => {
      st.textContent = '正在调起 Touch \'n Go eWallet...';

      // 构建 Android Intent URI：指定包名以绕过选择弹窗
      const intentUrl = `intent://` + CONTENT_URI + `#Intent;` +
        `action=android.intent.action.SEND;` +
        `type=image/png;` +
        `S.android.intent.extra.STREAM=${CONTENT_URI};` +
        `B.grant_read_uri_permission=true;` +
        `package=${TARGET_PACKAGE};` +
        `end`;

      // 重定向触发 Intent 启动 App
      window.location.href = intentUrl;

      console.log(ENCODED_URI)
      console.log(intentUrl)

    };
  </script>
</body>

</html>
