<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEMO</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
      background: #0e1726;
      color: #e8eef7
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border: 0;
      border-radius: 12px;
      margin: 8px 0;
      color: #fff
    }

    .a {
      background: #0d6efd
    }

    .b {
      background: #6c757d
    }

    #st {
      color: #f5b942;
      font-size: 13px;
      min-height: 18px;
      text-align: center;
      margin-top: 12px
    }

    p {
      color: #9fb0c7;
      font-size: 13px
    }
  </style>
</head>

<body>
  <p>按钮 A</p>
  <button class="a" id="btnA">带图片</button>

  <p>按钮 B</p>
  <button class="b" id="btnB">空面板</button>

  <div id="st"></div>

  <script>
    const st = document.getElementById('st');

    document.getElementById('btnA').onclick = async () => {
      try {
        const blob = await (await fetch('qr.png')).blob();
        const file = new File([blob], 'qr.png', { type: blob.type || 'image/png' });
        if (!navigator.canShare || !navigator.canShare({ files: [file] })) {
          st.textContent = '此浏览器不支持文件分享';
          return;
        }
        await navigator.share({ files: [file], title: 'QR' });
        st.textContent = 'A 完成（图片已附带，接收方拿到真实文件）';
      } catch (e) {
        st.textContent = 'A: ' + (e.name === 'AbortError' ? '用户取消' : e.message);
      }
    };

    document.getElementById('btnB').onclick = () => {
      st.textContent = 'B 已发起（面板会弹，但没有图片载荷）';
      // 仅 action + type，无 extras —— Chrome 会剥掉网页附加的任何 extra
      location.href = 'intent://send/#Intent;action=android.intent.action.SEND;type=image/png;end';
    };
  </script>
</body>

</html>
